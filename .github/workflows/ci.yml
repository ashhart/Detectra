name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test "tests/**/*.test.mjs"
      - name: manifest sanity
        run: node -e "const m=require('./extension/dist/manifest.json'); if(m.manifest_version!==3) throw new Error('MV3 required'); console.log('manifest OK:', m.name, m.version)"
